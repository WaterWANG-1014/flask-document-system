<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - File System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f0f2f5 0%, #d1e3ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: #0d6efd;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3);
        }

        .login-icon i {
            font-size: 32px;
            color: white;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .input-group-text {
            background: transparent;
            border: none;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 4;
            color: #6c757d;
        }
        
        .input-with-icon {
            padding-left: 40px;
        }

        .position-relative {
            margin-bottom: 20px;
        }

        .captcha-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .captcha-img {
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            height: 48px;
            background: #fff;
            transition: transform 0.2s;
        }

        .captcha-img:hover {
            transform: scale(1.05);
        }

        .btn-login {
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
        }
        
        .flash-messages {
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted mb-4 small">Sign in to access the File System</p>

        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} rounded-3 small py-2 px-3 d-flex align-items-center border-0 shadow-sm">
                            <i class="bi bi-info-circle-fill me-2"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="position-relative">
                <i class="bi bi-person-fill input-group-text"></i>
                <input type="text" name="username" class="form-control input-with-icon" placeholder="Username (admin)" required autofocus>
            </div>
            
            <div class="position-relative">
                <i class="bi bi-key-fill input-group-text"></i>
                <input type="password" name="password" class="form-control input-with-icon" placeholder="Password" required>
            </div>

            <div class="captcha-row align-items-center">
                <div class="position-relative flex-grow-1 mb-0">
                    <i class="bi bi-shield-check input-group-text"></i>
                    <input type="text" name="captcha" class="form-control input-with-icon" placeholder="Captcha" required>
                </div>
                <img src="{{ url_for('get_captcha') }}" alt="Captcha" class="captcha-img" onclick="this.src='{{ url_for('get_captcha') }}?'+Math.random()" title="Click to refresh">
            </div>

            <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</button>
        </form>
        
        <div class="mt-4 text-muted small opacity-50">System V18.0 Zen</div>
    </div>

</body>
</html>
